# CI-TESTS-001 — run the repo's node --test suite on every push/PR to main.
#
# Closes the gap in WARROOM-TREND-001: the trend-sign property tests (and the
# rest of test/) had real teeth (manually proven — an inverted sign() failed
# them) but nothing in CI actually executed them. This wires `npm test`
# (node --test test/) into a required check so a regression fails the build,
# not just a local run.

name: ci-tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run test suite (node --test test/)
        run: npm test

  # WARROOM-CONTRACT-CI-001 — mechanical regression gate for the War Room render contracts
  # (C2 bare em-dash, C3 status literals, C5 one clock, C6 one source per number, trend-
  # glyph sign agreement). One shared module with the pre-commit hook
  # (.pre-commit-config.yaml's warroom-contract-gate id) — no copied logic, per the card's
  # own "the drift will always favor green" warning. Second job in this SAME workflow file
  # (not a new workflow) so it shares ci-tests's trigger and doesn't need its own.
  #
  # fetch-depth: 0 is REQUIRED here, not cosmetic: the gate is diff-scoped (judges only
  # lines added since the merge-base — see scripts/warroom-contract-gate.js module header
  # for why whole-file scanning of a 4,492-line page would be a false-positive wall). The
  # default shallow checkout makes `git diff origin/main...HEAD` resolve against a
  # nonexistent history and silently see zero changed files, which would make this job
  # permanently green with no teeth — exactly the failure mode a mechanical gate exists to
  # prevent.
  #
  # CORRECTION (08-27): on a `push` trigger, `origin/main...HEAD` is ALSO a no-teeth bug,
  # for a different reason — `git fetch origin main` fetches the SAME ref this workflow was
  # triggered by, so by the time the diff runs, origin/main == HEAD (the push already landed
  # on main) and the diff is empty even with full history. `pull_request` doesn't have this
  # problem (origin/main is the PR's target branch, genuinely behind HEAD's merge commit),
  # so only the push path needs a different base. `github.event.before` (the pre-push SHA)
  # is the correct base for a push event; it falls back to origin/main for anything else
  # (pull_request, or the all-zero SHA GitHub sends on a branch's first push, which can't be
  # fetched as a real commit).
  contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine diff base ref (push uses event.before, else origin/main)
        id: diffbase
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
            git fetch origin "$BEFORE_SHA"
            echo "base=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            git fetch origin main
            echo "base=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Run War Room contract gate (diff-scoped)
        run: node scripts/warroom-contract-gate.js --base ${{ steps.diffbase.outputs.base }}
